name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Abbruchregeln stehen bewusst PRO JOB, nicht auf Workflow-Ebene: Eine
# workflow-weite Regel mit cancel-in-progress würde beim nächsten Push auch
# einen laufenden Deploy abwürgen. Die Prüfjobs dürfen abgebrochen werden,
# der Deploy-Job nicht.

jobs:
  backend-lint:
    name: Backend — Lint (ruff)
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Run ruff (critical rules only)
        working-directory: kompagnon/backend
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

  backend-import:
    name: Backend — Smoke import
    runs-on: ubuntu-latest
    concurrency:
      group: import-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kompagnon/backend/requirements.txt
      - name: Install dependencies
        working-directory: kompagnon/backend
        run: pip install -r requirements.txt
      - name: Smoke-import main
        working-directory: kompagnon/backend
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-dummy-secret-key-not-for-prod
          ANTHROPIC_API_KEY: ci-dummy
          ENVIRONMENT: development
        run: |
          python -c "import main; routes = len(main.app.routes); print(f'OK: {routes} routes registered'); assert routes > 30, f'expected > 30 routes, got {routes}'"

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: kompagnon/frontend/package-lock.json
      - name: Install dependencies
        working-directory: kompagnon/frontend
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: kompagnon/frontend
        env:
          CI: false
          REACT_APP_API_URL: https://claude-code-znq2.onrender.com
        run: npm run build
      - name: Report bundle size
        working-directory: kompagnon/frontend
        run: du -sh build && du -sh build/static/js

  secrets-scan:
    name: Secrets — Gitleaks
    runs-on: ubuntu-latest
    concurrency:
      group: gitleaks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan repository
        run: gitleaks detect --source . --no-banner --redact --verbose

  # ── Deploy — läuft NUR wenn alle vier Prüfjobs grün sind ────────────────────
  #
  # Voraussetzung: Auto-Deploy ist in Render für alle vier Services abgeschaltet.
  # Sonst deployt Render parallel und der Torwächter hier ist wirkungslos.
  # Benötigte Konfiguration im Repo (Settings → Secrets and variables → Actions):
  #   Secret   RENDER_API_KEY
  #   Variable RENDER_SERVICE_BACKEND_STAGING   (srv-…)
  #   Variable RENDER_SERVICE_FRONTEND_STAGING  (srv-…)
  #   Variable RENDER_SERVICE_BACKEND_PROD      (srv-…)
  #   Variable RENDER_SERVICE_FRONTEND_PROD     (srv-…)
  deploy:
    name: Deploy — Render
    needs: [backend-lint, backend-import, frontend-build, secrets-scan]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Zielumgebung bestimmen
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            {
              echo "label=Produktiv"
              echo "backend=${{ vars.RENDER_SERVICE_BACKEND_PROD }}"
              echo "frontend=${{ vars.RENDER_SERVICE_FRONTEND_PROD }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "label=Staging"
              echo "backend=${{ vars.RENDER_SERVICE_BACKEND_STAGING }}"
              echo "frontend=${{ vars.RENDER_SERVICE_FRONTEND_STAGING }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy auslösen und auf Abschluss warten
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TARGET_LABEL: ${{ steps.target.outputs.label }}
          BACKEND_SERVICE: ${{ steps.target.outputs.backend }}
          FRONTEND_SERVICE: ${{ steps.target.outputs.frontend }}
        run: |
          set -euo pipefail

          POLL_INTERVAL_SECONDS=15
          MAX_WAIT_SECONDS=900
          API="https://api.render.com/v1"

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY ist nicht gesetzt."
            exit 1
          fi
          if [ -z "$BACKEND_SERVICE" ] || [ -z "$FRONTEND_SERVICE" ]; then
            echo "::error::Service-IDs für $TARGET_LABEL fehlen (Repository-Variablen prüfen)."
            exit 1
          fi

          # Antwort IMMER auswerten: Bei 401/404 liefert die API kein .id, und ein
          # stilles null führt sonst dazu, dass anschliessend minutenlang ein
          # nicht existierender Deploy abgefragt wird.
          #
          # ACHTUNG: Diese Funktion wird in einer Befehlssubstitution aufgerufen.
          # Ihr stdout ist die Deploy-ID — sonst nichts. Jede Meldung muss nach
          # stderr (>&2), sonst landet sie in der Variablen statt im Log.
          trigger_deploy() {
            local service_id="$1" name="$2"
            local response http_code body deploy_id

            response="$(curl -sS -w $'\n%{http_code}' -X POST "$API/services/$service_id/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')"

            http_code="$(printf '%s' "$response" | tail -1)"
            body="$(printf '%s' "$response" | sed '$d')"

            if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
              echo "::error::$name: Render antwortete mit HTTP $http_code auf $service_id" >&2
              case "$http_code" in
                401) echo "::error::Der RENDER_API_KEY wird abgelehnt — Secret neu setzen." >&2 ;;
                403) echo "::error::Der Schluessel hat keinen Zugriff auf diesen Service." >&2 ;;
                404) echo "::error::Service-ID $service_id existiert nicht fuer diesen Schluessel." >&2 ;;
              esac
              echo "Antwort: $(printf '%s' "$body" | head -c 300)" >&2
              return 1
            fi

            # Je nach Endpunkt liegt die ID direkt oder unter .deploy
            deploy_id="$(printf '%s' "$body" | jq -r '.id // .deploy.id // empty')"
            if [ -z "$deploy_id" ]; then
              echo "::error::$name: Antwort enthaelt keine Deploy-ID." >&2
              echo "Antwort: $(printf '%s' "$body" | head -c 300)" >&2
              return 1
            fi

            printf '%s' "$deploy_id"
          }

          wait_for_deploy() {
            local service_id="$1" deploy_id="$2" name="$3"
            local waited=0 status=""

            while [ "$waited" -lt "$MAX_WAIT_SECONDS" ]; do
              status="$(curl -sS "$API/services/$service_id/deploys/$deploy_id" \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                | jq -r '.status // .deploy.status // "unbekannt"')"

              case "$status" in
                live)
                  echo "✓ $name: live"
                  return 0
                  ;;
                build_failed|update_failed|canceled|deactivated)
                  echo "::error::$name: Deploy fehlgeschlagen (Status $status)"
                  return 1
                  ;;
                *)
                  echo "  $name: $status … (${waited}s)"
                  ;;
              esac

              sleep "$POLL_INTERVAL_SECONDS"
              waited=$((waited + POLL_INTERVAL_SECONDS))
            done

            echo "::error::$name: Zeitüberschreitung nach ${MAX_WAIT_SECONDS}s (zuletzt $status)"
            return 1
          }

          echo "▸ Ziel: $TARGET_LABEL"

          backend_deploy="$(trigger_deploy "$BACKEND_SERVICE"  "Backend")"
          frontend_deploy="$(trigger_deploy "$FRONTEND_SERVICE" "Frontend")"
          echo "▸ Backend-Deploy $backend_deploy, Frontend-Deploy $frontend_deploy"

          wait_for_deploy "$BACKEND_SERVICE"  "$backend_deploy"  "Backend"
          wait_for_deploy "$FRONTEND_SERVICE" "$frontend_deploy" "Frontend"

          echo "✓ $TARGET_LABEL vollständig deployt"
