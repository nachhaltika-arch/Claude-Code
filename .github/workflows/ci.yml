name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Abbruchregeln stehen bewusst PRO JOB, nicht auf Workflow-Ebene: Eine
# workflow-weite Regel mit cancel-in-progress würde beim nächsten Push auch
# einen laufenden Deploy abwürgen. Die Prüfjobs dürfen abgebrochen werden,
# der Deploy-Job nicht.

jobs:
  backend-lint:
    name: Backend — Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" pip install ruff==0.6.9
      - name: Run ruff (critical rules only)
        working-directory: kompagnon/backend
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

  backend-import:
    name: Backend — Smoke import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: import-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kompagnon/backend/requirements.txt
      - name: Install dependencies
        working-directory: kompagnon/backend
        run: bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" pip install -r requirements.txt
      - name: Smoke-import main
        working-directory: kompagnon/backend
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-dummy-secret-key-not-for-prod
          ANTHROPIC_API_KEY: ci-dummy
          ENVIRONMENT: development
        run: |
          # `app.routes` zaehlt seit FastAPI 0.141 nur die eingehaengten Router,
          # nicht die Endpunkte — die entstehen erst beim Start. Die Schwelle 30
          # war damit fast nicht mehr zu reissen: 61 Wrapper bestehen sie auch,
          # wenn kein einziger Endpunkt dahinter haengt. Das OpenAPI-Verzeichnis
          # zaehlt, was wirklich erreichbar ist (18.08.2026: 401).
          python -c "import main; pfade = main.app.openapi().get('paths', {}); print(f'OK: {len(pfade)} Endpunkte'); assert len(pfade) > 300, f'nur {len(pfade)} Endpunkte — Router nicht geladen?'"

  backend-tests:
    name: Backend — Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        # Die Tests brauchen echtes Postgres: das Datenmodell nutzt JSONB,
        # das SQLite nicht kennt.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kompagnon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kompagnon/backend/requirements*.txt
      - name: Install dependencies
        working-directory: kompagnon/backend
        run: bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        working-directory: kompagnon/backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kompagnon_test
        run: pytest

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: kompagnon/frontend/package-lock.json
      - name: Install dependencies
        working-directory: kompagnon/frontend
        run: bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm ci --legacy-peer-deps
      # Laeuft im Build-Job mit, weil die Abhaengigkeiten hier ohnehin schon
      # installiert sind — ein eigener Job waere ein zweites `npm ci`.
      - name: Unit-Tests (jest)
        working-directory: kompagnon/frontend
        env:
          CI: true
        run: npm test -- --watchAll=false
      - name: Build
        working-directory: kompagnon/frontend
        env:
          CI: false
          REACT_APP_API_URL: https://api.kompagnon.group
        run: npm run build
      - name: Report bundle size
        working-directory: kompagnon/frontend
        run: du -sh build && du -sh build/static/js

  e2e:
    name: Browser — E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kompagnon_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kompagnon_e2e
      SECRET_KEY: e2e-secret-not-for-production
      ENVIRONMENT: development
      USE_MOCK_EMAIL: "true"
      ANTHROPIC_API_KEY: ""
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kompagnon/backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: |
            kompagnon/frontend/package-lock.json
            kompagnon/e2e/package-lock.json

      - name: Install backend
        working-directory: kompagnon/backend
        run: bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" pip install -r requirements.txt

      # Der Editor gibt nur den naechsten Schritt nach der letzten lueckenlosen
      # Kette frei. Ohne dieses Seed sind Sitemap, Wireframe und Style Guide
      # gesperrt und der kritische Pfad nicht pruefbar.
      - name: Seed test data
        working-directory: kompagnon/backend
        run: python -m tests.seed_e2e

      - name: Start backend
        working-directory: kompagnon/backend
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend bereit nach ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Backend wurde nicht bereit"; tail -50 /tmp/backend.log; exit 1

      - name: Build and serve frontend
        working-directory: kompagnon/frontend
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:8000
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm ci --legacy-peer-deps
          npm run build
          # serve fest installieren statt per npx zur Startzeit zu ziehen:
          # ein Registry-Aussetzer soll den Test nicht mitten im Start treffen.
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm install --global serve@14.2.6
          nohup serve -s build -l 3000 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Frontend bereit nach ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Frontend wurde nicht bereit"; tail -50 /tmp/frontend.log; exit 1

      - name: Install Playwright
        working-directory: kompagnon/e2e
        # **Ohne `--with-deps`** — und das ist die Lehre aus zwei Ausfaellen:
        #
        # 17.08., Lauf #359: `--with-deps` blieb im `apt-get` haengen und lief
        # sechs Stunden in GitHubs Notbremse. Daraufhin kam die Zeitgrenze je
        # Versuch (`ci-retry.sh`).
        #
        # 18.08., Laeufe #386/#387: Die Zeitgrenze griff nach 600s — aber
        # `timeout` beendet den Vorgang, den es gestartet hat, nicht dessen
        # Kindeskinder. Das `apt-get` (PID 3085) lief weiter und hielt die
        # Sperre unter /var/lib/apt/lists/. Die beiden Wiederholungen starben
        # sofort an „Could not get lock". Aus sechs Stunden Haengen wurden
        # dreizehn Minuten Scheitern — besser, aber immer noch rot.
        #
        # Die Wurzel ist apt, nicht die Wartezeit. Das Runner-Abbild von GitHub
        # bringt die Bibliotheken fuer Chromium mit; wir brauchen nur den
        # Browser selbst. Faellt eine Bibliothek doch, meldet sich Chromium
        # beim Start — sichtbar und in Sekunden, statt lautlos in Minuten.
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npm ci
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" npx playwright install chromium

      - name: Run browser tests
        working-directory: kompagnon/e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "── Backend ──"; tail -80 /tmp/backend.log || true
          echo "── Frontend ──"; tail -40 /tmp/frontend.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: kompagnon/e2e/playwright-report/
          retention-days: 7

  secrets-scan:
    name: Secrets — Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gitleaks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # -f laesst curl bei HTTP-Fehlern scheitern, pipefail reicht den Fehler
          # durch die Pipe weiter — sonst meldet nur tar, und zwar Erfolg.
          bash "$GITHUB_WORKSPACE/scripts/ci-retry.sh" bash -c \
            'set -o pipefail; curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz'
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan repository
        run: gitleaks detect --source . --no-banner --redact --verbose

  # ── Deploy — läuft NUR wenn alle sechs Prüfjobs grün sind ──────────────────
  #
  # Voraussetzung: Auto-Deploy ist in Render für die Produktiv-Services abgeschaltet.
  # Sonst deployt Render parallel und der Torwächter hier ist wirkungslos.
  # Benötigte Konfiguration im Repo (Settings → Secrets and variables → Actions):
  #   Secret   RENDER_API_KEY
  #   Variable RENDER_SERVICE_BACKEND_STAGING   (srv-…)
  #   Variable RENDER_SERVICE_FRONTEND_STAGING  (srv-…)
  #   Variable RENDER_SERVICE_BACKEND_PROD      (srv-…)
  #   Variable RENDER_SERVICE_FRONTEND_PROD     (srv-…)
  deploy:
    name: Deploy — Render
    needs: [backend-lint, backend-import, backend-tests, frontend-build, e2e, secrets-scan]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Zielumgebung bestimmen
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            {
              echo "label=Produktiv"
              echo "backend=${{ vars.RENDER_SERVICE_BACKEND_PROD }}"
              echo "frontend=${{ vars.RENDER_SERVICE_FRONTEND_PROD }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "label=Staging"
              echo "backend=${{ vars.RENDER_SERVICE_BACKEND_STAGING }}"
              echo "frontend=${{ vars.RENDER_SERVICE_FRONTEND_STAGING }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy auslösen und auf Abschluss warten
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TARGET_LABEL: ${{ steps.target.outputs.label }}
          BACKEND_SERVICE: ${{ steps.target.outputs.backend }}
          FRONTEND_SERVICE: ${{ steps.target.outputs.frontend }}
        run: |
          set -euo pipefail

          POLL_INTERVAL_SECONDS=15
          MAX_WAIT_SECONDS=900
          API="https://api.render.com/v1"

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY ist nicht gesetzt."
            exit 1
          fi
          if [ -z "$BACKEND_SERVICE" ] || [ -z "$FRONTEND_SERVICE" ]; then
            echo "::error::Service-IDs für $TARGET_LABEL fehlen (Repository-Variablen prüfen)."
            exit 1
          fi

          # Antwort IMMER auswerten: Bei 401/404 liefert die API kein .id, und ein
          # stilles null führt sonst dazu, dass anschliessend minutenlang ein
          # nicht existierender Deploy abgefragt wird.
          #
          # ACHTUNG: Diese Funktion wird in einer Befehlssubstitution aufgerufen.
          # Ihr stdout ist die Deploy-ID — sonst nichts. Jede Meldung muss nach
          # stderr (>&2), sonst landet sie in der Variablen statt im Log.
          trigger_deploy() {
            local service_id="$1" name="$2"
            local response http_code body deploy_id

            response="$(curl -sS -w $'\n%{http_code}' -X POST "$API/services/$service_id/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')"

            http_code="$(printf '%s' "$response" | tail -1)"
            body="$(printf '%s' "$response" | sed '$d')"

            if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
              echo "::error::$name: Render antwortete mit HTTP $http_code auf $service_id" >&2
              case "$http_code" in
                401) echo "::error::Der RENDER_API_KEY wird abgelehnt — Secret neu setzen." >&2 ;;
                403) echo "::error::Der Schluessel hat keinen Zugriff auf diesen Service." >&2 ;;
                404) echo "::error::Service-ID $service_id existiert nicht fuer diesen Schluessel." >&2 ;;
              esac
              echo "Antwort: $(printf '%s' "$body" | head -c 300)" >&2
              return 1
            fi

            # Je nach Endpunkt liegt die ID direkt oder unter .deploy
            deploy_id="$(printf '%s' "$body" | jq -r '.id // .deploy.id // empty')"
            if [ -z "$deploy_id" ]; then
              echo "::error::$name: Antwort enthaelt keine Deploy-ID." >&2
              echo "Antwort: $(printf '%s' "$body" | head -c 300)" >&2
              return 1
            fi

            printf '%s' "$deploy_id"
          }

          wait_for_deploy() {
            local service_id="$1" deploy_id="$2" name="$3"
            local waited=0 status=""

            while [ "$waited" -lt "$MAX_WAIT_SECONDS" ]; do
              status="$(curl -sS "$API/services/$service_id/deploys/$deploy_id" \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                | jq -r '.status // .deploy.status // "unbekannt"')"

              case "$status" in
                live)
                  echo "✓ $name: live"
                  return 0
                  ;;
                build_failed|update_failed|canceled|deactivated)
                  echo "::error::$name: Deploy fehlgeschlagen (Status $status)"
                  return 1
                  ;;
                *)
                  echo "  $name: $status … (${waited}s)"
                  ;;
              esac

              sleep "$POLL_INTERVAL_SECONDS"
              waited=$((waited + POLL_INTERVAL_SECONDS))
            done

            echo "::error::$name: Zeitüberschreitung nach ${MAX_WAIT_SECONDS}s (zuletzt $status)"
            return 1
          }

          echo "▸ Ziel: $TARGET_LABEL"

          backend_deploy="$(trigger_deploy "$BACKEND_SERVICE"  "Backend")"
          frontend_deploy="$(trigger_deploy "$FRONTEND_SERVICE" "Frontend")"
          echo "▸ Backend-Deploy $backend_deploy, Frontend-Deploy $frontend_deploy"

          wait_for_deploy "$BACKEND_SERVICE"  "$backend_deploy"  "Backend"
          wait_for_deploy "$FRONTEND_SERVICE" "$frontend_deploy" "Frontend"

          echo "✓ $TARGET_LABEL deployt — warte auf Betriebsbereitschaft"

          # Renders `live` heisst: der Prozess antwortet. Es heisst nicht: der
          # Dienst ist hochgefahren. Die acht Startphasen (Migrationen,
          # Scheduler, Demokonten-Abschaltung) laufen als Hintergrundaufgabe
          # weiter, nachdem der Server schon Anfragen beantwortet.
          #
          # Am 18.08.2026 lagen dazwischen viereinhalb Minuten: `live` um
          # 09:43:58, `startup_complete` erst um 09:48:32. Waere in der Zeit
          # eine Phase gescheitert, waere der Deploy-Job trotzdem gruen
          # gewesen — und genau dieser Fall (sieben von acht Phasen fielen
          # aus) blieb hier schon einmal monatelang unbemerkt.
          READY_MAX_SECONDS=600

          backend_url="$(curl -sS "$API/services/$BACKEND_SERVICE" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            | jq -r '.serviceDetails.url // empty')"

          if [ -z "$backend_url" ]; then
            echo "::error::Keine URL für $BACKEND_SERVICE — Bereitschaft nicht prüfbar."
            exit 1
          fi

          waited=0
          while [ "$waited" -lt "$READY_MAX_SECONDS" ]; do
            gesundheit="$(curl -sS --max-time 20 "$backend_url/health" || echo '{}')"
            # Waehrend eines Neustarts antwortet der Proxy auch mal mit HTML.
            # Ohne diesen Auffangbogen liesse `jq` den Schritt sofort sterben —
            # eine Zwischenausgabe wuerde als Ergebnis gelten.
            if ! printf '%s' "$gesundheit" | jq -e . > /dev/null 2>&1; then
              gesundheit='{}'
            fi
            fertig="$(printf '%s' "$gesundheit"  | jq -r '.startup_complete // "null"')"
            fehlend="$(printf '%s' "$gesundheit" | jq -r '(.startup_missing // []) | join(", ")')"

            if [ -n "$fehlend" ]; then
              echo "::error::$TARGET_LABEL: Startphasen ausgefallen: $fehlend"
              printf '%s\n' "$gesundheit"
              exit 1
            fi

            if [ "$fertig" = "true" ]; then
              echo "✓ $TARGET_LABEL betriebsbereit nach ${waited}s"
              exit 0
            fi

            echo "  Start läuft noch (startup_complete=$fertig) … (${waited}s)"
            sleep "$POLL_INTERVAL_SECONDS"
            waited=$((waited + POLL_INTERVAL_SECONDS))
          done

          echo "::error::$TARGET_LABEL: Start nicht abgeschlossen nach ${READY_MAX_SECONDS}s"
          printf '%s\n' "$gesundheit"
          exit 1
