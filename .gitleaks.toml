title = "KAS gitleaks config"

# Inherit all default rules from gitleaks
[extend]
useDefault = true

# Known false positives.
# These were development fallback keys (base64 of "thisisafake_keyfordevonlyuse123"),
# removed from the codebase in commit 7ea99bf ("security: harden secrets, webhooks
# and remove duplicate endpoints"). The current code uses os.getenv with empty default
# and fail-fast — no real secrets ever shipped. Allowlisting historical commits only.
[allowlist]
description = "Historical dev fallback key removed in 7ea99bf — not a real secret"
# Match the exact fake-key string ("thisisafake_keyfordevonlyuse123" in base64).
# Was a placeholder fallback in old commits, never a real credential.
regexTarget = "match"
regexes = [
  '''dGhpc2lzYWZha2Vf[A-Za-z0-9+/=]+''',
  # Erfundener Testwert aus Commit f7dece2 (L-98, 24.08.2026). Er stand in
  # `tests/test_schluessel_nicht_im_protokoll.py` und pruefte, dass die
  # Schwaerzung greift — hatte aber die Form eines echten Google-Schluessels
  # (`AIzaSy…`), und Gitleaks schlug zu Recht an (Lauf 32716902764).
  #
  # Im Arbeitsstand ist der Wert bereits ersetzt; er steckt nur noch in der
  # Historie, und die wird bei jedem Lauf mitgelesen. Deshalb hier, und
  # deshalb **woertlich** statt als Muster: Diese eine Zeichenkette
  # verstummt, jede kuenftige `AIzaSy…`-Zeichenkette schlaegt weiter an.
  '''AIzaSyGEHEIM123''',
  # Derselbe Fehler, drei Tage spaeter (27.08.2026, Lauf 33050180660): ein
  # Testpasswort in `tests/test_rolle_mitarbeiter.py` mit Entropie 3.78, das
  # Gitleaks als `generic-api-key` las. Im Arbeitsstand steht laengst ein
  # Wert ohne Schluesselform; diese Zeichenkette steckt nur noch im Commit
  # fbc593d. Woertlich wie oben — der naechste hochentropische Testwert soll
  # weiter anschlagen.
  '''einlangesPasswort2026''',
  # Und noch einmal am selben Abend (27.08.2026, Lauf 33100571929): ein
  # Testwert in `tests/test_health_zahlungen.py`, der die Praefix-Pruefung
  # belegen sollte und dabei die Form eines eingeschraenkten
  # Stripe-Schluessels annahm (Regel `stripe-access-token`).
  #
  # Im Arbeitsstand werden die Praefixe seither **zusammengesetzt** statt
  # geschrieben, es entsteht dort also gar keine Schluesselform mehr. Diese
  # Zeichenkette steckt nur noch im Commit aecf6c4. Woertlich wie die beiden
  # darueber — jeder kuenftige `rk_test_…`-Wert soll weiter anschlagen.
  '''rk_test_ebenfallsGeheim''',
]
# Also allowlist by historical commit hash for belt-and-braces:
commits = [
  "e7038a0381005a9f7cf826553d62dd768eca64d6",
  "14a722fa33c78c86f3524db9259a6ddbc233dbf9",
  "70f4c5b7a1ff0bc66d9bb4c763d786ed717dd69c",
]
