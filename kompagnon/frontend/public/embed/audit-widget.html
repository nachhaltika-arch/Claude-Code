<!-- Diese Seite ist seit dem 21.09.2026 nur noch die Huelle. Das Widget selbst
     steht in `widget.js` als <kompagnon-audit>.

     **Sie bleibt trotzdem, und das ist kein Altlast-Aufschub.** Kundenseiten
     binden genau diese Adresse als iframe ein (L-03). Wer sie entfernt, nimmt
     das Widget von Seiten, die uns nicht gehoeren und die wir nicht nachziehen
     koennen. Zwei Auslieferungsformen, ein Codestand. -->
<style>html, body { margin: 0; padding: 0; background: transparent; }</style>
</head>
<body>
<kompagnon-audit></kompagnon-audit>
