<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>KOMPAGNON — Gratis Website-Analyse</title>
<style>
  /* ── KOMPAGNON Audit-Widget · self-contained · keine externen Abhängigkeiten ── */
  :root {
    --kpg-dark:   #04293a;   /* Heading dunkel-teal */
    --kpg-teal:   #207a92;   /* Eyebrow / Akzent */
    --kpg-yellow: #FAE600;   /* CTA */
    --kpg-bg:     #f1efe9;   /* Karte beige */
    --kpg-border: #d8d5cd;
    --kpg-label:  #8a8a86;
    --kpg-muted:  #9a9a96;
    --kpg-text:   #3a3a38;
    --kpg-ok:     #1d9e75;
    --kpg-warn:   #e67e22;
    --kpg-bad:    #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  .kpg-card {
    font-family: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    background: var(--kpg-bg);
    border: 1px solid var(--kpg-border);
    border-radius: 12px;
    padding: clamp(24px, 5vw, 48px);
    color: var(--kpg-text);
  }
  .kpg-eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--kpg-teal);
    margin: 0 0 18px;
  }
  .kpg-h {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -.01em;
    text-transform: uppercase;
    color: var(--kpg-dark);
    margin: 0 0 28px;
  }
  .kpg-field { margin-bottom: 20px; }
  .kpg-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--kpg-label);
    margin: 0 0 8px;
  }
  .kpg-input {
    width: 100%;
    padding: 16px 18px;
    font-size: 17px;
    font-family: inherit;
    color: var(--kpg-dark);
    background: #fff;
    border: 1px solid var(--kpg-border);
    border-radius: 6px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .kpg-input::placeholder { color: #b5b5b0; }
  .kpg-consent {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 12px; line-height: 1.45; color: #55554f;
    margin: 14px 0 16px; cursor: pointer;
  }
  .kpg-consent input { margin-top: 2px; flex-shrink: 0; width: 15px; height: 15px; }
  .kpg-issues { margin: 18px 0 4px; }
  .kpg-issues-title {
    font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--kpg-label); margin-bottom: 7px;
  }
  .kpg-issues ul { margin: 0; padding-left: 18px; }
  .kpg-issues li { font-size: 14px; line-height: 1.5; margin-bottom: 5px; }
  .kpg-blocker {
    background: #fdecea; border-left: 3px solid #b02418; border-radius: 5px;
    padding: 10px 13px; margin: 14px 0 0; font-size: 13px; line-height: 1.5;
  }
  .kpg-mailnote {
    background: #f3f5f4; border-radius: 7px; padding: 13px 15px;
    margin: 18px 0; font-size: 13px; line-height: 1.55;
  }
  .kpg-input:focus {
    border-color: var(--kpg-teal);
    box-shadow: 0 0 0 3px rgba(32,122,146,.12);
  }
  .kpg-hint {
    font-size: 13px;
    color: var(--kpg-muted);
    margin: 8px 0 0;
  }
  .kpg-btn {
    width: 100%;
    margin-top: 8px;
    padding: 18px 20px;
    border: none;
    border-radius: 4px;
    background: var(--kpg-yellow);
    color: #1a1a1a;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: filter .15s, transform .05s;
  }
  .kpg-btn:hover  { filter: brightness(.95); }
  .kpg-btn:active { transform: translateY(1px); }
  .kpg-btn:disabled { opacity: .6; cursor: not-allowed; }
  .kpg-foot {
    font-size: 13px;
    color: var(--kpg-muted);
    text-align: center;
    margin: 22px 0 0;
  }
  /* Ohne eigene Regel malt der Browser den Datenschutz-Link blau-violett
     und unterstrichen — quer zur Fusszeile. */
  .kpg-foot a { color: inherit; text-decoration: none; }
  /* Nur das Wort wird unterstrichen, nicht das Trennzeichen davor. */
  .kpg-foot a span { text-decoration: underline; text-underline-offset: 2px; }
  .kpg-foot a:hover { color: var(--kpg-dark); }

  /* ── Loading ── */
  .kpg-center { text-align: center; padding: 12px 0; }
  .kpg-spinner {
    width: 52px; height: 52px;
    margin: 8px auto 22px;
    border: 4px solid rgba(32,122,146,.18);
    border-top-color: var(--kpg-teal);
    border-radius: 50%;
    animation: kpg-spin .9s linear infinite;
  }
  @keyframes kpg-spin { to { transform: rotate(360deg); } }
  @keyframes kpg-pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .kpg-progress { font-size: 16px; color: var(--kpg-muted); animation: kpg-pulse 2s infinite; }
  .kpg-target {
    display: inline-block; margin-top: 18px; padding: 8px 16px;
    background: #fff; border: 1px solid var(--kpg-border); border-radius: 6px;
    font-size: 14px; font-weight: 600; color: var(--kpg-teal);
  }

  /* ── Result ── */
  .kpg-score { font-size: 54px; font-weight: 800; line-height: 1; }
  .kpg-verdict {
    display: inline-flex; align-items: center; padding: 5px 14px;
    border-radius: 20px; font-size: 13px; font-weight: 700; margin-top: 6px;
  }
  .kpg-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 22px 0;
  }
  @media (min-width: 480px) { .kpg-grid { grid-template-columns: repeat(4, 1fr); } }
  .kpg-tile {
    background: #fff; border: 1px solid var(--kpg-border); border-radius: 8px;
    padding: 14px 8px; text-align: center;
  }
  .kpg-tile-num { font-size: 24px; font-weight: 800; margin-bottom: 3px; }
  .kpg-tile-lbl { font-size: 12px; color: var(--kpg-label); line-height: 1.3; }
  .kpg-summary {
    background: #fff; border: 1px solid var(--kpg-border); border-radius: 8px;
    padding: 14px 16px; font-size: 14px; color: var(--kpg-text); line-height: 1.6; margin-bottom: 22px;
  }
  .kpg-btn-secondary {
    background: transparent; color: var(--kpg-teal);
    border: 1.5px solid var(--kpg-teal); letter-spacing: .04em;
  }
  .kpg-link {
    display: inline-block; margin-top: 16px; color: var(--kpg-teal);
    font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="kpg-card" id="kpg-card">
    <!-- ── Schritt 1: Eingabe ── -->
    <!-- Ohne novalidate: bei leeren Feldern meldet sich der Browser selbst.
         Vorher endete ein Klick auf „Analyse starten“ mit leeren Feldern
         wortlos — der Knopf wirkte kaputt. -->
    <form id="kpg-form">
      <p class="kpg-eyebrow">Gratis · Sofortergebnis · Kein Login</p>
      <h2 class="kpg-h">Ihre Website<br>jetzt analysieren</h2>

      <div class="kpg-field">
        <label class="kpg-label" for="kpg-email">Geschäftliche E-Mail</label>
        <input class="kpg-input" id="kpg-email" type="email" required
               autocomplete="email" placeholder="name@firma.de" />
        <p class="kpg-hint">Wir erkennen Ihre Website automatisch</p>
      </div>

      <div class="kpg-field">
        <label class="kpg-label" for="kpg-url">Website-URL</label>
        <input class="kpg-input" id="kpg-url" type="text" required
               autocomplete="url" placeholder="www.ihr-betrieb.de" />
      </div>

      <label class="kpg-consent" for="kpg-consent">
        <input type="checkbox" id="kpg-consent" />
        <span>Ich bin einverstanden, dass KOMPAGNON mich zu meiner Website-Analyse
        per E-Mail kontaktiert. Die Einwilligung kann ich jederzeit widerrufen.</span>
      </label>

      <button class="kpg-btn" id="kpg-submit" type="submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="#1a1a1a" stroke-width="2"/>
          <path d="M12 7v5l3 2" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Analyse starten
      </button>
      <!-- Trennzeichen steht im Link, sonst bleibt ein „·“ ohne Ziel stehen,
           solange kein Datenschutz-Link konfiguriert ist. -->
      <p class="kpg-foot">Der Bericht geht an die angegebene Adresse<a
           id="kpg-privacy" href="#" target="_blank" rel="noopener"
           style="display:none"> · <span>Datenschutz</span></a></p>
    </form>
  </div>

<script>
(function () {
  'use strict';

  /* ── Konfiguration: per <body data-api="…"> oder ?api= überschreibbar ── */
  /* Das Backend richtet sich nach der Herkunft des Widgets: die
     Staging-Fassung spricht das Staging-Backend an, die produktive das
     produktive. Ohne diese Ableitung rief die Staging-Fassung das
     Produktiv-Backend an — dort gibt es den Widget-Endpunkt (noch) nicht,
     und das Formular endete in einem Fehler. */
  var IST_STAGING = location.hostname.indexOf('staging') !== -1;

  var API_BASE =
    document.body.getAttribute('data-api') ||
    new URLSearchParams(location.search).get('api') ||
    (IST_STAGING
      ? 'https://kompagnon-backend-staging.onrender.com'
      : 'https://claude-code-znq2.onrender.com');

  var CHECKOUT_URL =
    document.body.getAttribute('data-checkout') ||
    'https://kompagnon-frontend.onrender.com/checkout/kompagnon';

  /* Datenschutz-Link und CTA-Ziel kommen aus den Einstellungen im Tool
     (Akquise → Widget), damit sie ohne neuen Einbaucode änderbar sind. */
  function loadConfig() {
    fetch(API_BASE + '/api/widget/config')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (cfg) {
        if (!cfg) return;
        if (cfg.checkout_url) CHECKOUT_URL = cfg.checkout_url;
        var link = document.getElementById('kpg-privacy');
        if (link && cfg.privacy_url) {
          link.href = cfg.privacy_url;
          link.style.display = '';
        }
        if (cfg.headline) {
          var h = document.querySelector('.kpg-h');
          if (h) h.textContent = cfg.headline;
        }
        postHeight();
      })
      .catch(function () { /* Widget bleibt ohne Konfiguration nutzbar */ });
  }

  var POLL_INTERVAL_MS = 4000;
  var MAX_POLL_ATTEMPTS = 45;

  var FREE_MAIL = ['gmail.com','gmx.de','gmx.net','web.de','yahoo.de','yahoo.com',
                   'hotmail.com','outlook.com','icloud.com','t-online.de','freenet.de'];

  var MSGS = [
    '🔍 Website wird analysiert…',
    '⚡ Performance wird gemessen…',
    '⚖️ Rechtliches wird geprüft…',
    '🔒 Sicherheit wird untersucht…',
    '📈 SEO wird bewertet…',
    '🤖 KI-Analyse läuft…'
  ];

  var card    = document.getElementById('kpg-card');
  var form    = document.getElementById('kpg-form');
  var emailEl = document.getElementById('kpg-email');
  var urlEl   = document.getElementById('kpg-url');

  /* ── Helpers ── */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function normalizeUrl(raw) {
    raw = (raw || '').trim();
    if (!raw) return '';
    if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
    return raw;
  }
  function scoreColor(s) {
    return s >= 70 ? 'var(--kpg-ok)' : s >= 50 ? 'var(--kpg-warn)' : 'var(--kpg-bad)';
  }
  function level(s) {
    if (s >= 85) return 'Homepage Standard Platin 💎';
    if (s >= 70) return 'Homepage Standard Gold 🥇';
    if (s >= 50) return 'Homepage Standard Silber 🥈';
    if (s >= 30) return 'Homepage Standard Bronze 🥉';
    return 'Nicht konform ⚠️';
  }
  /* Höhe an Eltern-Seite melden (für iframe-Auto-Resize) */
  function postHeight() {
    try {
      var h = document.documentElement.scrollHeight;
      parent.postMessage({ type: 'kpg-audit-height', height: h }, '*');
    } catch (e) { /* no-op */ }
  }

  /* ── Website aus E-Mail-Domain ableiten ──
     Die Ableitung folgt der Eingabe, solange der Nutzer das URL-Feld nicht
     selbst angefasst hat. Früher wurde beim ersten Zeichen nach dem „@“
     geschrieben und danach nie wieder korrigiert — aus „info@firma.de“
     wurde die URL „f“. Ab der ersten eigenen Eingabe im URL-Feld bleibt
     die Ableitung stumm. */
  var urlBearbeitet = false;
  urlEl.addEventListener('input', function () { urlBearbeitet = true; });

  emailEl.addEventListener('input', function () {
    if (urlBearbeitet) return;
    var val = emailEl.value;
    var at = val.indexOf('@');
    var host = at === -1 ? '' : val.slice(at + 1).toLowerCase().trim();
    urlEl.value = (host && FREE_MAIL.indexOf(host) === -1) ? host : '';
  });

  /* ── Submit ── */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = emailEl.value.trim();
    var url   = normalizeUrl(urlEl.value);
    if (!email || !url) return;
    startAudit(email, url);
  });

  function startAudit(email, cleanUrl) {
    renderLoading(cleanUrl);

    var idx = 0;
    var progressEl = document.getElementById('kpg-progress');
    var msgTimer = setInterval(function () {
      idx = (idx + 1) % MSGS.length;
      if (progressEl) progressEl.textContent = MSGS[idx];
    }, POLL_INTERVAL_MS);

    fetch(API_BASE + '/api/widget/audit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        website_url: cleanUrl,
        consent_marketing: !!(document.getElementById('kpg-consent') || {}).checked,
        referrer: document.referrer || ''
      })
    })
    .then(function (r) {
      return r.json().then(function (body) {
        if (!r.ok) throw new Error(body.detail || 'Analyse konnte nicht gestartet werden.');
        return body;
      });
    })
    .then(function (start) {
      if (!start.audit_id) throw new Error('Analyse konnte nicht gestartet werden.');
      pollAudit(start.audit_id, cleanUrl, msgTimer, email);
    })
    .catch(function (err) {
      clearInterval(msgTimer);
      renderError((err && err.message) || 'Verbindungsfehler — bitte erneut versuchen.');
    });
  }

  function pollAudit(auditId, cleanUrl, msgTimer, email) {
    var attempts = 0;
    var poll = setInterval(function () {
      attempts++;
      if (attempts > MAX_POLL_ATTEMPTS) {
        clearInterval(poll); clearInterval(msgTimer);
        renderError('Zeitüberschreitung — bitte erneut versuchen.');
        return;
      }
      fetch(API_BASE + '/api/widget/teaser/' + encodeURIComponent(auditId))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.status === 'completed') {
            clearInterval(poll); clearInterval(msgTimer);
            renderResult(d, cleanUrl, email);
          } else if (d.status === 'failed') {
            clearInterval(poll); clearInterval(msgTimer);
            /* Nicht der URL die Schuld geben: meistens war die Seite nur
               kurz nicht erreichbar. */
            renderError('Die Seite war nicht erreichbar. Bitte die Adresse prüfen ' +
                        'oder in ein paar Minuten erneut versuchen.');
          }
        })
        .catch(function () { /* einzelnen Poll-Fehler ignorieren */ });
    }, POLL_INTERVAL_MS);
  }

  /* ── Render: Loading ── */
  function renderLoading(cleanUrl) {
    var host = cleanUrl.replace(/^https?:\/\//, '').replace(/^www\./, '');
    card.innerHTML =
      '<div class="kpg-center">' +
        '<div class="kpg-spinner"></div>' +
        '<div style="font-size:18px;font-weight:700;color:var(--kpg-dark);margin-bottom:8px;">Audit läuft…</div>' +
        '<div class="kpg-progress" id="kpg-progress">' + esc(MSGS[0]) + '</div>' +
        '<div class="kpg-target">' + esc(host) + '</div>' +
      '</div>';
    postHeight();
  }

  /* ── Render: Error ── */
  function renderError(msg) {
    card.innerHTML =
      '<div class="kpg-center">' +
        '<div style="font-size:42px;margin-bottom:12px;">😔</div>' +
        '<div style="font-size:18px;font-weight:700;color:var(--kpg-dark);margin-bottom:8px;">Etwas ist schiefgelaufen</div>' +
        '<div style="font-size:15px;color:var(--kpg-muted);margin-bottom:22px;">' + esc(msg) + '</div>' +
        '<button class="kpg-btn kpg-btn-secondary" style="max-width:240px;margin:0 auto;" id="kpg-retry">← Erneut versuchen</button>' +
      '</div>';
    document.getElementById('kpg-retry').addEventListener('click', resetWidget);
    postHeight();
  }

  /* ── Render: Teaser ──
     Bewusst nur Score, Level und die drei größten Punkte. Der vollständige
     Bericht kommt per E-Mail — das ist der Anlass, ins Postfach zu schauen. */
  function renderResult(data, cleanUrl, email) {
    var score = data.total_score || 0;
    var col = scoreColor(score);
    var host = cleanUrl.replace(/^https?:\/\//, '').replace(/^www\./, '');

    var issues = (data.top_issues || []).slice(0, 3);
    var issueHtml = '';
    if (issues.length) {
      issueHtml =
        '<div class="kpg-issues">' +
          '<div class="kpg-issues-title">Die größten Punkte</div>' +
          '<ul>' + issues.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' +
        '</div>';
    }

    var blockerHtml = '';
    if (data.blocker_count) {
      blockerHtml =
        '<div class="kpg-blocker">' +
          esc(data.blocker_count) +
          (data.blocker_count === 1 ? ' rechtlicher Ausschlussgrund' : ' rechtliche Ausschlussgründe') +
          ' begrenzen die Bewertung — Details im Bericht.' +
        '</div>';
    }

    card.innerHTML =
      '<div>' +
        '<div style="font-size:13px;color:var(--kpg-label);margin-bottom:10px;">Analyse für ' + esc(host) + '</div>' +
        '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px;">' +
          '<div class="kpg-score" style="color:' + col + ';">' + esc(score) + '</div>' +
          '<div>' +
            '<div style="font-size:13px;color:var(--kpg-label);margin-bottom:4px;">Gesamtpunkte von 100</div>' +
            '<div class="kpg-verdict" style="color:' + col + ';background:' + col + '18;border:1px solid ' + col + '40;">' + esc(data.level || level(score)) + '</div>' +
          '</div>' +
        '</div>' +
        blockerHtml +
        issueHtml +
        '<div class="kpg-mailnote">' +
          '<strong>Der vollständige Bericht ist unterwegs</strong><br>' +
          'Alle 42 Kriterien mit Bewertung und Empfehlungen — an ' + esc(email || 'Ihre Adresse') + '.' +
        '</div>' +
        '<a class="kpg-btn" href="' + esc(CHECKOUT_URL) + '" target="_blank" rel="noopener" style="text-decoration:none;">Jetzt Webseite anfragen →</a>' +
        '<a class="kpg-link" id="kpg-restart">Neue Analyse starten</a>' +
      '</div>';
    document.getElementById('kpg-restart').addEventListener('click', resetWidget);
    postHeight();
  }

  function resetWidget() { location.reload(); }

  /* iframe-Höhe initial + bei Resize melden */
  window.addEventListener('load', postHeight);
  loadConfig();
  window.addEventListener('resize', postHeight);
})();
</script>
</body>
</html>
