<form data-block="hu-contact-forms-3"
      action="#"
      class="mx-auto max-w-md space-y-4 rounded-lg border border-gray-300 bg-gray-100 p-6"
    >
      <div>
        <label class="block text-sm font-medium text-gray-900">Name</label>

        <input
          class="mt-1 w-full rounded-lg border-gray-300 focus:border-gray-500 focus:outline-none"
          aria-label="Name"
          type="text"
          placeholder="Your name"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-900">Email</label>

        <input
          class="mt-1 w-full rounded-lg border-gray-300 focus:border-gray-500 focus:outline-none"
          aria-label="Email"
          type="email"
          placeholder="Your email"
        />
      </div>

      <fieldset>
        <legend class="block text-sm font-medium text-gray-900">Inquiry</legend>

        <div class="mt-2 space-y-2">
          <div class="flex items-center gap-2">
            <input
              class="size-5 rounded border-gray-300 text-gray-600 focus:ring-gray-500"
              aria-label="General Inquiry"
              type="checkbox"
              name="inquiry-type"
              value="general-inquiry"
            />

            <label class="block text-sm text-gray-900">General Inquiry</label>
          </div>

          <div class="flex items-center gap-2">
            <input
              class="size-5 rounded border-gray-300 text-gray-600 focus:ring-gray-500"
              aria-label="Support"
              type="checkbox"
              name="inquiry-type"
              value="support"
            />

            <label class="block text-sm text-gray-900">Support</label>
          </div>

          <div class="flex items-center gap-2">
            <input
              class="size-5 rounded border-gray-300 text-gray-600 focus:ring-gray-500"
              aria-label="Feedback"
              type="checkbox"
              name="inquiry-type"
              value="feedback"
            />

            <label class="block text-sm text-gray-900">Feedback</label>
          </div>

          <div class="flex items-center gap-2">
            <input
              class="size-5 rounded border-gray-300 text-gray-600 focus:ring-gray-500"
              aria-label="Other"
              type="checkbox"
              name="inquiry-type"
              value="other"
            />

            <label class="block text-sm text-gray-900">Other</label>
          </div>
        </div>
      </fieldset>

      <div>
        <label class="block text-sm font-medium text-gray-900">Message</label>

        <textarea
          class="mt-1 w-full resize-none rounded-lg border-gray-300 focus:border-gray-500 focus:outline-none"
          aria-label="Message"
          rows="4"
          placeholder="Your message"
        ></textarea>
      </div>

      <button
        class="block w-full rounded-lg border border-gray-600 bg-gray-600 px-12 py-3 text-sm font-medium text-white transition-colors hover:bg-transparent hover:text-gray-600"
        type="submit"
      >
        Send Message
      </button>
    </form>
