<!--
  Block: hw-karte — Einzugsgebiet (Ortsliste + Link zur Karte)
  Kategorie: HW
  Slots: section_headline, section_subline, city_list, map_link_url, map_link_label

  Kein eingebettetes Google Maps: Ein <iframe> überträgt die IP jedes Besuchers
  an Google, bevor er irgendetwas angeklickt hat — genau der K.-o.-Grund, den
  unser eigener Kriterienkatalog `tracking_ohne_consent` nennt. Wer die Route
  will, klickt; dann ist es seine Entscheidung.
-->
<section data-block="hw-karte" class="bg-slate-50 py-16 md:py-20 px-6" style="font-family: 'Noto Sans', sans-serif;">
  <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-12 items-stretch">
    <div class="flex flex-col justify-center">
      <h2 class="text-3xl md:text-4xl font-black uppercase text-gray-900 tracking-tight mb-4">{{section_headline}}</h2>
      <p class="text-base text-slate-600 leading-relaxed mb-6">{{section_subline}}</p>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <div class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-3">Wir bedienen u. a.</div>
        <div class="text-base text-slate-800 leading-relaxed">{{city_list}}</div>
      </div>
    </div>
    <div class="rounded-2xl overflow-hidden shadow-lg min-h-[360px] bg-gray-200 flex flex-col items-center justify-center gap-4 p-8 text-center">
      <svg class="size-12 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      <p class="text-sm text-gray-600 max-w-xs">{{map_hinweis}}</p>
      <a href="{{map_link_url}}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 rounded-lg bg-gray-900 px-5 py-3 text-sm font-bold text-white">
        {{map_link_label}}
      </a>
    </div>
  </div>
</section>
