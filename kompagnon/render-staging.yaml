# KAS — Render Blueprint (STAGING)
#
# Definiert die komplette Staging-Umgebung auf Branch `staging`:
#   - kompagnon-staging-db        (Postgres)
#   - kompagnon-backend-staging   (FastAPI)
#   - kompagnon-frontend-staging  (React)
#
# Die DB `kompagnon-staging-db` wurde am 2026-05-02 manuell angelegt.
# Render erkennt den Namen und nimmt die existierende DB in den Blueprint
# auf (Doku-Modus, wie bei kompagnon/render.yaml für Produktiv).
# DATABASE_URL wird automatisch via fromDatabase befüllt — KEIN manueller
# Eintrag nötig.
#
# Blueprint anwenden:
#   1. Diese Datei committen + nach `staging` pushen
#   2. Render Dashboard → New → Blueprint
#   3. Repo `nachhaltika-arch/Claude-Code` auswählen, Branch `staging`
#   4. Blueprint-Pfad: kompagnon/render-staging.yaml
#   5. Nach Erstellung: alle `sync: false`-Variablen im Dashboard befüllen
#      (siehe Kommentare unten)
#
# WICHTIG für Staging:
#   - Stripe: TEST-Keys verwenden (sk_test_…, pk_test_…)
#   - SMTP: Test-/Sandbox-Account oder gleicher SMTP wie Live (egal — Staging sendet nur an dich)
#   - CORS_ALLOWED_ORIGINS / FRONTEND_URL: Staging-Frontend-URL eintragen
#   - REACT_APP_API_URL (Frontend): Staging-Backend-URL eintragen, sobald Backend deployed ist

databases:
  - name: kompagnon-staging-db
    # Render schreibt Postgres-Plaene mit Bindestrich (basic-256mb, basic-1gb, …).
    # Mit Unterstrich schlaegt der Blueprint-Sync fehl: "not a valid plan".
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []   # nur interner Zugriff aus Render-Services

services:
  # ── Backend Staging (FastAPI) ────────────────────────────────────────────────
  - type: web
    name: kompagnon-backend-staging
    runtime: python
    region: frankfurt
    plan: starter
    branch: staging
    rootDir: kompagnon/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 30
    healthCheckPath: /health
    # Deploy wird von GitHub Actions ausgeloest (.github/workflows/ci.yml),
    # erst nach gruener CI. Im Render-Dashboard muss Auto-Deploy ebenfalls
    # auf 'Off' stehen — sonst deployt Render parallel am Gate vorbei.
    autoDeploy: false
    # ── Datentraeger fuer hochgeladene Dateien ──────────────────────────
    # Ohne diesen Block liegen Uploads im Container und sind bei JEDEM Deploy
    # weg. Am 16.08.2026 festgestellt: Die eine vorhandene Datei war bereits
    # verloren. Betroffen sind Kundendateien (routers/files.py), Bilder
    # (routers/assets.py) und die Auftragsbestaetigungs-PDFs.
    #
    # ACHTUNG beim Anwenden: Render haengt einen Datentraeger nur an Dienste
    # mit genau EINER Instanz, und das Anlegen erzwingt einen Neustart.
    # 1 GB ist der kleinste Schritt und reicht um Groessenordnungen.
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Runtime
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Zeigt auf den eingehaengten Datentraeger. Ohne die Variable schreibt
      # der Code weiter relativ nach `uploads` — also in den Container.
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: ENVIRONMENT
        value: staging

      # Database — automatisch aus Postgres-Service oben gezogen
      - key: DATABASE_URL
        fromDatabase:
          name: kompagnon-staging-db
          property: connectionString

      # Auth / Security — eigene Werte für Staging (NICHT Produktiv-Secrets recyceln)
      - key: SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # API_BASE_URL steht bewusst nicht hier. Sie landet im Berichtslink der
      # Widget-Mail, und als sie fehlte, fiel der Code auf die Produktiv-
      # Adresse zurueck: Audit auf Staging, Token in der Staging-Datenbank,
      # Link zum Produktiv-Server — „Not Found" bei jeder Anfrage. Der Code
      # nimmt jetzt RENDER_EXTERNAL_URL, das Render je Dienst selbst setzt.
      # Erst wenn eine eigene Domain davorsteht (produktiv seit 16.08.:
      # api.kompagnon.group), muss
      # API_BASE_URL hier gesetzt werden — RENDER_EXTERNAL_URL zeigt dann
      # weiterhin auf die onrender.com-Adresse.

      # AI (Anthropic / Claude) — kann gleicher Key wie Produktiv sein, oder Test-Workspace-Key
      - key: ANTHROPIC_API_KEY
        sync: false

      # SMTP (Transaktionsmails)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER_NAME
        sync: false
      - key: SMTP_SENDER_EMAIL
        sync: false
      - key: FROM_EMAIL
        sync: false

      # Brevo (Newsletter) — Test-Account oder leer lassen für Staging
      - key: BREVO_API_KEY
        sync: false

      # ── Der Scheduler auf Staging (L-104, 24.08.2026) ───────────────────
      #
      # **Warum Staging den Scheduler fährt und nicht abschaltet:** Staging
      # ist die Probe der Produktion. Ein Dienst, der die vierzehn
      # Zeitaufträge gar nicht startet, probt sie auch nicht — dann fällt ein
      # kaputter Job erst produktiv auf.
      #
      # **Warum er trotzdem nichts versenden darf:** Unter den vierzehn sind
      # versendende (`email_sequence_runner`, der Monatsbericht). Welche
      # Adressen in der Staging-Datenbank stehen, weiß niemand sicher — genau
      # die Frage, die am 17.08. den Mail-Vorfall ausgelöst hat.
      #
      # Beide Werte stehen **ausdrücklich** hier, nicht als Vorgabe im Code:
      # `SCHEDULER_ENABLED` hat den Standard `true` und `USE_MOCK_EMAIL` den
      # Standard `false` — ein aus dieser Datei neu gebautes Staging hätte
      # also versendet, ohne dass irgendeine Datei das sagt.
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: USE_MOCK_EMAIL
        value: "true"

      # Stripe — PFLICHT: Test-Keys (sk_test_…) auf Staging
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_GEO
        sync: false

      # Netlify (Customer Site Hosting) — eigener Test-Token oder gleicher Token mit anderem Site-Prefix
      - key: NETLIFY_API_TOKEN
        sync: false
      # Die Qualitätsschleife deployt die eigene Seite als Vorschau und misst
      # sie. Ohne diese eine Adresse passiert nichts (503) — genau so gebaut,
      # damit keine Vorschau je eine Kundensite überschreibt. L-40.
      #
      # **Am 24.08.2026 nachgetragen.** Am Dienst war die Variable seit dem
      # 23.08. gesetzt (`kompagnon-vorschau-staging`), in dieser Datei fehlte
      # sie. Wer Staging aus dem Blueprint neu aufbaut, verliert die
      # Qualitätsschleife stillschweigend: Sie antwortet dann sauber mit 503,
      # und niemand sucht nach einer Variablen, die im Blueprint nie stand.
      # Dieselbe Klasse wie L-35 — die Dateien beschreiben, sie steuern nicht.
      - key: NETLIFY_VORSCHAU_SITE_ID
        sync: false

      # Google PageSpeed Insights — gleicher Key wie Produktiv ist OK (read-only Quota)
      - key: GOOGLE_PAGESPEED_API_KEY
        sync: false

      # Admin-Seed
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── Frontend Staging (React) ─────────────────────────────────────────────────
  - type: web
    name: kompagnon-frontend-staging
    runtime: node
    region: frankfurt
    plan: starter
    branch: staging
    rootDir: kompagnon/frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    # Ohne -s: die Rewrites stehen in public/serve.json, zusammen mit
    # cleanUrls:false. Sonst leitet serve /embed/audit-widget.html auf
    # /embed/audit-widget um und die React-App verschluckt das Widget.
    startCommand: npx serve build -l $PORT
    # Deploy wird von GitHub Actions ausgeloest (.github/workflows/ci.yml),
    # erst nach gruener CI. Im Render-Dashboard muss Auto-Deploy ebenfalls
    # auf 'Off' stehen — sonst deployt Render parallel am Gate vorbei.
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "18.20.0"
      # Manuell nach Backend-Deploy setzen: https://kompagnon-backend-staging.onrender.com
      - key: REACT_APP_API_URL
        sync: false
      - key: CI
        value: "false"
      # GrapesJS Studio SDK License Key — uebersteuert den hardcoded Fallback.
      - key: REACT_APP_GJS_LICENSE_KEY
        sync: false
