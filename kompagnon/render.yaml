# KAS — Render Blueprint (PRODUKTIV, Ist-Zustand — VERALTET)
#
# ⚠️ Diese Datei beschreibt den Produktivbetrieb NICHT korrekt. Sie nennt sich
# „Wahrheits-Datei", ist aber an keinen Dienst gebunden: Produktiv ist nichts
# blueprint-verwaltet (L-35). Was hier steht, ist deshalb nie geprüft worden,
# und vier Angaben sind nachweislich falsch:
#
#   | hier                             | tatsächlich                        |
#   |----------------------------------|------------------------------------|
#   | Backend `region: frankfurt`      | **Oregon (US West)** — L-34        |
#   | DB `kompagnon-db`, Postgres 16   | `Kompangnon-dB`, Postgres 18       |
#   | DB `plan: starter`               | `basic-256mb`                      |
#   | DB `ipAllowList: []`             | **0.0.0.0/0**, offenes Internet    |
#   | Frontend als Web-Service         | **Static Site**                    |
#
# Dazu fehlen 32 Variablen, die der Quelltext liest und die kein Automatismus
# setzt — darunter vier der sechs Webhook-Geheimnisse (Brevo, Netlify,
# Trackdesk und das allgemeine) sowie `CREDENTIALS_KEY` und
# `CMS_ENCRYPTION_KEY`, ohne die gespeicherte Zugangsdaten unlesbar bleiben.
#
# Der Nachfolger steht in `render-produktiv.yaml` und beschreibt den neuen
# Dienst in Frankfurt (L-34). Diese Datei bleibt bis zum Umzug als Beleg des
# Ist-Zustands stehen und wird danach gelöscht — nicht gepflegt.
#
# Erhoben am 2026-08-16, Belege in `docs/umzug-backend-frankfurt.md`.

databases:
  - name: kompagnon-db
    plan: starter
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []   # nur interner Zugriff aus Render-Services

services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  - type: web
    name: claude-code-znq2
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    rootDir: kompagnon/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 30
    healthCheckPath: /health
    # Deploy wird von GitHub Actions ausgeloest (.github/workflows/ci.yml),
    # erst nach gruener CI. Im Render-Dashboard muss Auto-Deploy ebenfalls
    # auf 'Off' stehen — sonst deployt Render parallel am Gate vorbei.
    autoDeploy: false
    envVars:
      # Runtime
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production

      # Database (automatisch aus Postgres-Service oben gezogen)
      - key: DATABASE_URL
        fromDatabase:
          name: kompagnon-db
          property: connectionString

      # Auth / Security
      - key: SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # AI (Anthropic / Claude)
      - key: ANTHROPIC_API_KEY
        sync: false

      # SMTP (Transaktionsmails)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER_NAME
        sync: false
      - key: SMTP_SENDER_EMAIL
        sync: false
      - key: FROM_EMAIL
        sync: false

      # Brevo (Newsletter)
      - key: BREVO_API_KEY
        sync: false

      # Stripe (Payments + GEO Add-On)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET_GEO
        sync: false

      # Netlify (Customer Site Hosting)
      - key: NETLIFY_API_TOKEN
        sync: false

      # Google PageSpeed Insights (Audit)
      - key: GOOGLE_PAGESPEED_API_KEY
        sync: false

      # Admin-Seed (nur initial befüllt, kann leer sein)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ── Frontend (React) ─────────────────────────────────────────────────────────
  - type: web
    name: kompagnon-frontend
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    rootDir: kompagnon/frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    # Ohne -s: die Rewrites stehen in public/serve.json, zusammen mit
    # cleanUrls:false. Sonst leitet serve /embed/audit-widget.html auf
    # /embed/audit-widget um und die React-App verschluckt das Widget.
    startCommand: npx serve build -l $PORT
    # Deploy wird von GitHub Actions ausgeloest (.github/workflows/ci.yml),
    # erst nach gruener CI. Im Render-Dashboard muss Auto-Deploy ebenfalls
    # auf 'Off' stehen — sonst deployt Render parallel am Gate vorbei.
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "18.20.0"
      - key: REACT_APP_API_URL
        value: https://claude-code-znq2.onrender.com
      - key: CI
        value: "false"   # Build nicht durch React-Warnings abbrechen
      # GrapesJS Studio SDK License Key — uebersteuert den hardcoded Fallback
      # in src/utils/studioEditorConfig.js:22. Im Render Dashboard setzen.
      - key: REACT_APP_GJS_LICENSE_KEY
        sync: false
